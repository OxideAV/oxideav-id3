[package]
name = "oxideav-id3"
version = "0.0.5"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-id3"
authors = ["Mark Karpeles"]
description = "Pure-Rust ID3v1 / ID3v2 (2.2 / 2.3 / 2.4) tag parser for oxideav"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-id3"
keywords = ["multimedia", "audio", "id3", "mp3", "metadata"]
categories = ["multimedia::audio", "parser-implementations"]

[dependencies]
oxideav-core = "0.1"

# `compcol` (Karpelès Lab's compression collection, the workspace-wide
# choice for byte-stream codecs) supplies the RFC 1950 zlib stream the
# ID3v2 frame-level compression flag is defined over (v2.3 §3.3 flag
# `i` / v2.4 §4.1.2 flag `k`: "compressed using zlib").
# `default-features = false` keeps the dependency to exactly that one
# algorithm.
compcol = { version = "0.6", default-features = false, features = ["zlib"] }

[dev-dependencies]
# Round 209 (depth-mode benchmarks): Criterion drives the `id3` bench
# harness in `benches/id3.rs` that future rounds use to A/B parser /
# writer tweaks (extended-header walk, frame-size accounting, picture
# payload copy, key/value flattening). Pinned to the same 0.5 line the
# other OxideAV crates with benches (flac, cinepak, tta, magicyuv,
# h264, pixfmt) already track.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Round 209 bench. Self-contained: every byte fixture is hand-built in
# the bench from a deterministic xorshift seed using the wire layout
# described in `docs/container/id3/id3v2.4.0-structure.html`. No
# committed fixture files. Run with:
#     cargo bench -p oxideav-id3 --bench id3
[[bench]]
name = "id3"
harness = false
